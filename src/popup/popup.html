<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>フリマキット</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      width: 340px; margin: 0; padding: 14px;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 13px; line-height: 1.6; color: #111827; background: #fff;
    }
    h1 { font-size: 14px; margin: 0 0 2px; }
    .sub { margin: 0 0 12px; font-size: 11px; color: #6b7280; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .card h2 { font-size: 11px; color: #6b7280; margin: 0 0 8px; letter-spacing: .04em; }
    dl { margin: 0; font-size: 12px; }
    dl div { display: flex; justify-content: space-between; gap: 10px; padding: 1px 0; }
    dt { color: #6b7280; }
    dd { margin: 0; font-weight: 600; text-align: right; word-break: break-all; }
    ul { list-style: none; margin: 0; padding: 0; font-size: 12px; }
    li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 3px 0; }
    li .detail { display: block; color: #6b7280; font-size: 11px; font-weight: 400; }
    .pill { flex: none; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .pill[data-status="ok"] { background: #dcfce7; color: #166534; }
    .pill[data-status="skip"] { background: #f3f4f6; color: #4b5563; }
    .pill[data-status="error"] { background: #fee2e2; color: #991b1b; }
    .empty { color: #6b7280; font-size: 12px; margin: 0; }
    .actions { display: flex; gap: 8px; }
    button {
      flex: 1; font: inherit; font-size: 12px; padding: 7px 10px; cursor: pointer;
      border: 1px solid #d1d5db; border-radius: 6px; background: #fff;
    }
    button:hover { background: #f3f4f6; }
    button.primary { background: #16a34a; border-color: #16a34a; color: #fff; font-weight: 600; }
    button.primary:hover { background: #15803d; }
  </style>
</head>
<body>
  <h1>フリマキット</h1>
  <p class="sub">動作の確認と設定</p>

  <div class="card">
    <h2>このページ</h2>
    <div id="page"><p class="empty">確認しています…</p></div>
  </div>

  <div class="card">
    <h2>機能の状態</h2>
    <div id="health"><p class="empty">—</p></div>
  </div>

  <div class="actions">
    <button type="button" id="open-panel">パネルを開く</button>
    <button type="button" id="open-options" class="primary">設定</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
